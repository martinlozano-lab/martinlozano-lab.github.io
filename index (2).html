<body>

    <!-- Notificaciones -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 px-6 py-3 rounded-xl shadow-2xl font-bold flex items-center gap-3 fade-in hidden-view" style="background-color: var(--text); color: var(--bg);">
        <i class="ph ph-info text-2xl"></i> <span id="toast-msg">Empaquetando tu web...</span>
    </div>

    <!-- Cabecera -->
    <header class="sticky top-0 z-40 border-b border-theme shadow-sm backdrop-blur-md bg-opacity-90" style="background-color: var(--bg);">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer hover:opacity-70" onclick="showView('dashboard')">
                <i class="ph ph-hexagon text-3xl"></i>
                <h1 id="site-title" class="font-bold text-xl">6th Cycle Project</h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleTheme()" class="p-2 border border-theme rounded-full hover:opacity-70"><i class="ph ph-moon" id="theme-icon"></i></button>
                <div id="auth-controls">
                    <button onclick="showView('settings')" class="text-sm font-semibold hover:opacity-70 flex items-center gap-2 text-blue-500"><i class="ph ph-cloud-arrow-up"></i> Publicar</button>
                    <button onclick="logout()" class="text-sm font-semibold hover:opacity-70 flex items-center gap-2 text-red-500 ml-4"><i class="ph ph-sign-out"></i> Salir</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 py-10 fade-in" id="main-content"></main>

    

</body>
</html>
