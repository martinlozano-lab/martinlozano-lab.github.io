te—which, in fact, wasn’t very difficult to build—we met with the group and began brainstorming ideas for projects we could undertake. In the end, we narrowed it down to three finalists:\n1. Portable air heater \n2. Waste sorter \n3. Ergonomic Environmental Monitor (Industrial Safety)\nWe'll keep discussing this, and by Week 2 we hope to have finalized the concept for the final project we'll be submitting.\n\n-Challenges of the week:\nThe most difficult part of the first week was narrowing down all our ideas to just three. \n\nWritten by: Martin Lozano","mediaType":"image","media":"","mediaList":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDABALDA4MChAODQ4SERATGCgaGBYWGDEjJR0oOjM9PDkzODdASFxOQERXRTc4UG1RV19iZ2hnPk1xeXBkeFxlZ2P/2wBDARESEhgVGC8aGi9jQjhCY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2P/wAARCAEsAZADASIAAhEBAxEB/8QAGwAAAQUBAQAAAAAAAAAAAAAABAECAwUGAAf/xABGEAACAQMCBAMFBQYDBgYCAwABAgMABBESIQUxQVETYXEGIjKBkRShscHRFSNCUuHwcpLxJDNDU2KCJURUk6LSc8IWY7L/xAAaAQADAQEBAQAAAAAAAAAAAAAAAQIDBAUG/8QAKxEAAgICAgICAQMDBQAAAAAAAAECEQMSITETQQRRIjJhgSNxkQUzUrHB/9oADAMBAAIRAxEAPwA4b04dqbyp3mK887BkurwzoJyN8d/KoxGrjZmAYZU6jsaI5jNDODHJjOEc7H+Vv61pBkyQdw+drdgjj3H91lzt61PeCXxWRLQNspD68ctx8xQKtrXl5EVZLcSyWLeCqvPGNlO2RXTB+jCS9kTi5lJM0cagLn3SSc9aFCpqOVGaJVb+aH/exwkgYAGSD1B5/wB4qKdPDcZKnHMrWeWNcovG/QpjTAIQfSlKhk2ApgbDYpS4U5JwKwNSqbhjGQ/v ome exercises we’ve done in programs such as AutoCAD, Fusion 360, etc. These will be uploaded to a folder on Google Drive at the following link: : https://drive.google.com/drive/folders/1a-g32lSRhGD2TV8hDyprxLrdAtBahSI3?usp=drive_link\n4. And finally, a preliminary sketch was created with the help of AI to get an idea of what the monitor might look like; you can find the sketch below (third image). \n5. As a final activity, we conducted a 3D printing lab session. You can find details about this session in the section titled: Lab Sessions, Lab Session 1\n-Challenges of the week:\n1. Adaptation to the new software under investigation \n2. Searching for Reliable Databases \n3. Identify the main issues\n\nWritten by: David Lopez and Nicolas Rubio \n\n","mediaType":"image","media":"","mediaList":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDABALDA4MChAODQ4SERATGCgaGBYWGDEjJR0oOjM9PDkzODdASFxOQERXRTc4UG1RV19iZ2hnPk1xeXBkeFxlZ2P/2wBDARESEhgVGC8aGi9jQjhCY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2P/wAARCAGQASwDASIAAhEBAxEB/8QAGwAAAQUBAQAAAAAAAAAAAAAABAECAwUGAAf/xABBEAACAQMCBAMFBgUDAwQCAwABAgMABBESIQUxQVETImEGMnGBkRRCobHB0SNSYuHwFTNyFkPxJDSCkiVTc6LC/8QAGgEAAwEBAQEAAAAAAAAAAAAAAAECAwQFBv/EACURAAICAwEAAwACAwEBAAAAAAABAhEDITESE0FRBCIyQmEzgf/aAAwDAQACEQMRAD8AiUCeJZJckTDRKOx/vnHzFUh9lrtnIjddIOxO2a0PjWZ/gQ4AfYkDbPT50y4nuEtgVcqUb WYnpCBmObK5l1W6gDT2VXo561GOMwxAIv9N6wy25Gt3TkKlhyFBlhnTALFFjcPHIGJuJQRbW247x/CmMNiI4g6y42OS7EqS63A5U5YchUsOQoF8EyvHIykMplaxBuDrTFXwqqD/9k="]},{"title":"Week 5: Kerf Settings","content":"During Week 5, our primary focus was transitioning from digital design to physical fabrication using laser cutting technology. We delved into the principles of parameterization, utilizing slicer software to meticulously configure critical variables such as cutting speed and laser power based on our material specifications. This week also marked our first hands-on experience operating the Nextion laser cutting machine. After familiarizing ourselves with the hardware and safety protocols, we executed our initial cutting attempts for the ergonomic chair prototype. These first tests were crucial for evaluating the real-world tolerances of our press-fit joints and making necessary design adjustments. In addition to the prototype work, we completed a specific practical training exercise to master the machine's workflow. All technical details, parameters used, and outcomes of this activity can be found in the “Lab Sessions” section, specifically under “Lab Session 3.\n\n\n\nChallenges for the week: \n- Correctly calculate the 0.05 mm kerf \n- Design the parts correctly\n- Make accurate cuts without wasting material\n\nWritten by: Martin Lozano","mediaType":"none","media":"","mediaList":[]}],"id":"id_1790733552126","date":"29/9/2026"},{"title":" Lab Sessions","desc":"In this section, you can read about all the projects carried out week after week at the University of Cuenca's Fablab. These lab exercises help us become familiar with the machines in our environment and will help us make progress on our project.","category":"avance","mediaType":"image","media":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA  we learned to use was the FLSUN V400.\nTo complete this lab, our workgroup designed a keychain and a pencil holder in Fusion 360.\nThe keychain was created with the goal of learning how to print  flat objects on the printer; this was done to understand how to use the tools in the UltiMaker Cura software.\nThe incense holder was created with the goal of printing overhanging objects; this was done to learn how to configure the supports and infill for the object. \nYou can find the downloadable materials for this assignment at the following link: \n\nhttps://drive.google.com/drive/folders/1a-g32lSRhGD2TV8hDyprxLrdAtBahSI3?usp=drive_link\n\n\n- Challenges in Practice: \n1. Selecting the right scale for keychains \n2. Difficulty learning new software \n3. Fear of damaging the machine \n\nWritten by: Martin Lozano and Nicolas Rubio","mediaType":"image","media":"","mediaList":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDABALDA4MChAODQ4SERATGCgaGBYWGDEjJR0oOjM9PDkzODdASFxOQERXRTc4UG1RV19iZ2hnPk1xeXBkeFxlZ2P/2wBDARESEhgVGC8aGi9jQjhCY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2P/wAARCAGQAOEDASIAAhEBAxEB/8QAGgAAAwEBAQEAAAAAAAAAAAAAAAECAwUEBv/EAEgQAAEDAgMFBQQGBggGAwEAAAEAAhEDIQQSMQVBUWFxEyKBkaEywdHwFEJSkrHhBhUWI1WTJTVTVGJyo/EzQ0SC0uI0c6Ky/8QAFwEBAQEBAAAAAAAAAAAAAAAAAAECA//EAB4RAQEBAAMBAQEBAQAAAAAAAAABEQIhMRJBUQMi/9oADAMBAAIR ide the hollow model to escape, and we carefully generated the tree support structures required to ensure a successful and highly detailed print.\nOnce the printing process, which took approximately two hours, was completed, we proceeded with the essential post-processing phase. We carefully removed the piece and conducted a thorough cleaning of both the 3D printer and the model to eliminate any excess unreacted liquid resin. Finally, the piece underwent a post-curing process inside a UV light chamber. This final step was crucial to fully harden the photosensitive resin, ensuring the model achieved its maximum structural integrity, safety for handling, and a precise final finish.\n\nYou can find the downloadable files for this lab on Google Drive under “Lab Sessions,” in the “Lab Session 2” section, at the following link: \nhttps://drive.google.com/drive/folders/1a-g32lSRhGD2TV8hDyprxLrdAtBahSI3?usp=drive_link\n\n\nChallenges for the week: \n1. Correctly configuring the scale \n2. Preparing the resin in the 3D printer \n3. Cleaning the machine \n\nWritten by: David Lopez","mediaType":"image","media":"","mediaList":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDABALDA4MChAODQ4SERATGCgaGBYWGDEjJR0oOjM9PDkzODdASFxOQERXRTc4UG1RV19iZ2hnPk1xeXBkeFxlZ2P/2wBDARESEhgVGC8aGi9jQjhCY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2P <body>

    <!-- Notificaciones -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 px-6 py-3 rounded-xl shadow-2xl font-bold flex items-center gap-3 fade-in hidden-view" style="background-color: var(--text); color: var(--bg);">
        <i class="ph ph-info text-2xl"></i> <span id="toast-msg">Empaquetando tu web...</span>
    </div>

    <!-- Cabecera -->
    <header class="sticky top-0 z-40 border-b border-theme shadow-sm backdrop-blur-md bg-opacity-90" style="background-color: var(--bg);">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer hover:opacity-70" onclick="showView('dashboard')">
                <i class="ph ph-hexagon text-3xl"></i>
                <h1 id="site-title" class="font-bold text-xl">6th Cycle Project</h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleTheme()" class="p-2 border border-theme rounded-full hover:opacity-70"><i class="ph ph-moon" id="theme-icon"></i></button>
                <div id="auth-controls">
                    <button onclick="showView('settings')" class="text-sm font-semibold hover:opacity-70 flex items-center gap-2 text-blue-500"><i class="ph ph-cloud-arrow-up"></i> Publicar</button>
                    <button onclick="logout()" class="text-sm font-semibold hover:opacity-70 flex items-center gap-2 text-red-500 ml-4"><i class="ph ph-sign-out"></i> Salir</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 py-10 fade-in" id="main-content"></main>

    <script>
        // --- 1. MOTOR DE DATOS INTELIGENTE ---
        const PIN = "fablab2026";
        let isMember = sessionStorage.getItem('fab_auth') === 'yes';
        
        let dbTime = parseInt(document.getElementById('db-time').textContent || "0");
        let localTime = parseInt(localStorage.getItem('fab_time') || "0");
        let projects = [];
        let currentProject = null;

        // Decidir de dónde cargar los datos (Prioriza el archivo más reciente)
        if (dbTime >= localTime) {
            projects = JSON.parse(document.getElementById('db-data').textContent || '[]');
            document.getElementById('site-title').textContent = JSON.parse(document.getElementById('db-title').textContent || '"Avances FabLab"');
            
            // Actualizar memoria local para seguir trabajando
            localStorage.setItem('fab_data', JSON.stringify(projects));
            localStorage.setItem('fab_time', dbTime.toString());
            localStorage.setItem('fab_title', document.getElementById('site-title').textContent);
        } else {
            projects = JSON.parse(localStorage.getItem('fab_data') || '[]');
            document.getElementById('site-title').textContent = localStorage.getItem('fab_title') || "Avances FabLab";
        }

        // Inicialización visual
        if(localStorage.getItem('fab_dark') === 'true') document.body.classList.add('dark');
        document.getElementById('theme-icon').className = document.body.classList.contains('dark') ? 'ph ph-sun' : 'ph ph-moon';
        
        renderHeader();
        showView('dashboard');

        // --- 2. FUNCIONES DE UTILIDAD ---
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('hidden-view');
            toast.classList.add('fade-in');
            setTimeout(() => toast.classList.add('hidden-view'), 4000);
        }

        function toggleTheme() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem('fab_dark', isDark);
            document.getElementById('theme-icon').className = isDark ? 'ph ph-sun' : 'ph ph-moon';
        }

        function saveProjects() {
            try {
                let time = Date.now().toString();
                localStorage.setItem('fab_data', JSON.stringify(projects));
                localStorage.setItem('fab_time', time);
            } catch(e) { showToast("🚨 Memoria llena. Reduce imágenes."); }
        }

        function renderHeader() {
            const controls = document.getElementById('auth-controls');
            if (isMember) {
                controls.innerHTML = `
                    <button onclick="showView('settings')" class="text-sm font-semibold hover:opacity-70 flex items-center gap-2 text-blue-500"><i class="ph ph-cloud-arrow-up"></i> Publicar</button>
                    <button onclick="logout()" class="text-sm font-semibold hover:opacity-70 flex items-center gap-2 text-red-500 ml-4"><i class="ph ph-sign-out"></i> Salir</button>
                `;
            } else {
                controls.innerHTML = `<button onclick="showView('login')" class="flex items-center gap-2 text-sm font-bold px-4 py-2 border border-theme rounded-lg hover:opacity-70"><i class="ph ph-lock-key"></i> Editar</button>`;
            }
        }

        function logout() {
            isMember = false;
            sessionStorage.removeItem('fab_auth');
            renderHeader();
            showView('dashboard');
        }

        function showView(viewName, data = null) {
            const main = document.getElementById('main-content');
            main.innerHTML = ''; 
            main.className = 'max-w-6xl mx-auto p-6 py-10 fade-in';

            if (viewName === 'dashboard') renderDashboard(main);
            else if (viewName === 'login') renderLogin(main);
            else if (viewName === 'detail') { currentProject = data; renderDetail(main); }
            else if (viewName === 'editor') renderEditor(main, data);
            else if (viewName === 'settings') renderSettings(main);
        }

        // --- 3. EXPORTADOR MÁGICO PARA GITHUB (VERSIÓN SEGURA) ---
        function downloadWeb() {
            showToast("Empaquetando tu web...");
            
            const clone = document.documentElement.cloneNode(true);
            
            // Inyectar datos actuales
            clone.querySelector('#db-data').textContent = JSON.stringify(projects);
            clone.querySelector('#db-time').textContent = Date.now().toString();
            clone.querySelector('#db-title').textContent = JSON.stringify(document.getElementById('site-title').textContent);
            
            // Limpiar vistas dinámicas
            clone.querySelector('#main-content').innerHTML = '';
            clone.querySelector('#toast').classList.add('hidden-view');
            
            // Descargar
            const html = "<!DOCTYPE html>\n<html lang=\"es\">\n" + clone.innerHTML + "\n</html>";
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            a.click();
            URL.revokeObjectURL(url);
            
            showToast("¡Archivo descargado! Súbelo a tu GitHub.");
        }


        // --- 4. VISTAS DE NAVEGACIÓN ---
        function renderLogin(container) {
            container.innerHTML = `
                <div class="flex flex-col items-center py-20">
                    <button onclick="showView('dashboard')" class="text-muted mb-8 hover:opacity-70 font-semibold flex items-center gap-2"><i class="ph ph-arrow-left"></i> Volver</button>
                    <div class="max-w-xs w-full text-center">
                        <h2 class="text-2xl font-bold mb-2">Acceso a Miembros</h2>
                        <input type="password" id="pin-input" placeholder="Contraseña..." class="w-full text-center text-2xl tracking-widest bg-transparent border-b-2 border-theme py-2 focus:outline-none mb-4 mt-6" />
                        <p id="pin-error" class="text-red-500 text-sm font-bold hidden-view mb-4">PIN Incorrecto</p>
                        <button onclick="checkPin()" class="w-full py-3 rounded-lg font-bold shadow-md bg-accent">Entrar</button>
                    </div>
                </div>
            `;
        }

        function checkPin() {
            if (document.getElementById('pin-input').value === PIN) {
                isMember = true;
                sessionStorage.setItem('fab_auth', 'yes');
                renderHeader();
                showView('dashboard');
                showToast("Acceso concedido");
            } else {
                document.getElementById('pin-error').classList.remove('hidden-view');
            }
        }

        function renderDashboard(container) {
            let html = `
                <div class="flex flex-wrap justify-between items-center gap-4 mb-10 border-b border-theme pb-4">
                    <h2 class="text-3xl font-bold">Welcome</h2>
                    ${isMember ? `<button onclick="showView('editor')" class="flex items-center gap-2 px-5 py-2.5 rounded-lg font-bold shadow hover:opacity-90 bg-accent"><i class="ph ph-plus-circle text-xl"></i> Nuevo Proyecto</button>` : ''}
                </div>
            `;

            if (projects.length === 0) {
                html += `<div class="text-center py-24 text-muted border-2 border-dashed border-theme rounded-2xl"><p class="text-xl font-medium">Aún no hay contenido subido.</p></div>`;
            } else {
                // Separar por categorías
                const nosotros = projects.filter(p => p.category === 'nosotros');
                const avances = projects.filter(p => p.category === 'avance' || !p.category);

                if (nosotros.length > 0) {
                    html += `<h3 class="text-2xl font-bold mb-6 flex items-center gap-2"><i class="ph ph-users-three"></i> Sobre Nosotros</h3>`;
                    html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-16">`;
                    html += nosotros.map((p, i) => generateCard(p, projects.indexOf(p))).join('');
                    html += `</div>`;
                }
                
                if (avances.length > 0) {
                    html += `<h3 class="text-2xl font-bold mb-6 flex items-center gap-2"><i class="ph ph-rocket-launch"></i> Avances del Proyecto</h3>`;
                    html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">`;
                    html += avances.map((p, i) => generateCard(p, projects.indexOf(p))).join('');
                    html += `</div>`;
                }
            }
            container.innerHTML = html;
        }

        function generateCard(p, globalIdx) {
            let mediaHTML = `<div class="w-full h-full flex items-center justify-center opacity-20"><i class="ph ph-image text-6xl"></i></div>`;
            if (p.mediaType === 'image' && p.media) mediaHTML = `<img src="${p.media}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />`;
            else if (p.mediaType === 'video' && p.media) mediaHTML = `<div class="w-full h-full flex items-center justify-center bg-black/80 text-white"><i class="ph ph-play-circle text-5xl"></i></div>`;

            let controlsHTML = isMember ? `
                <div class="absolute top-3 right-3 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity z-10 bg-black/70 rounded-lg p-1.5">
                    <button onclick="event.stopPropagation(); moveProj(${globalIdx}, -1)" class="p-1 text-white hover:bg-white/20 rounded"><i class="ph ph-caret-left"></i></button>
                    <button onclick="event.stopPropagation(); moveProj(${globalIdx}, 1)" class="p-1 text-white hover:bg-white/20 rounded"><i class="ph ph-caret-right"></i></button>
                </div>` : '';

            return `
                <div class="group relative rounded-2xl overflow-hidden border border-theme shadow-sm hover:shadow-xl transition-all flex flex-col cursor-pointer bg-card" onclick="openProject('${p.id}')">
                    <div class="h-56 relative overflow-hidden bg-black/5">${mediaHTML}</div>
                    <div class="p-6 flex flex-col flex-1 relative">
                        <h3 class="font-bold text-2xl mb-2">${p.title}</h3>
                        <p class="text-sm line-clamp-3 mb-6 flex-1 text-muted">${p.desc}</p>
                        <div class="pt-4 border-t border-theme flex justify-between items-center mt-auto">
                            <span class="text-xs font-bold uppercase text-muted">${p.date}</span>
                            <span class="text-sm font-bold" style="color: var(--accent)">Ver más <i class="ph ph-arrow-right ml-1"></i></span>
                        </div>
                    </div>
                    ${controlsHTML}
                </div>`;
        }

        function moveProj(idx, dir) {
            if (idx + dir < 0 || idx + dir >= projects.length) return;
            [projects[idx], projects[idx+dir]] = [projects[idx+dir], projects[idx]];
            saveProjects();
            showView('dashboard');
        }

        function openProject(id) {
            const proj = projects.find(p => p.id === id);
            if (proj) showView('detail', proj);
        }

        function renderDetail(container) {
            let mediaHTML = '';
            if (currentProject.mediaType === 'image' && currentProject.media) mediaHTML = `<img src="${currentProject.media}" class="w-full rounded-2xl mb-12 shadow-lg object-cover max-h-[70vh]" />`;
            if (currentProject.mediaType === 'video' && currentProject.media) mediaHTML = `<div class="mb-12 rounded-2xl border border-theme"><a href="${currentProject.media}" target="_blank" class="flex flex-col items-center justify-center p-12 bg-black/5 hover:bg-black/10"><i class="ph ph-link-simple text-5xl mb-4"></i><span class="font-bold">Abrir enlace de video</span></a></div>`;

            let subsHTML = '';
            if (currentProject.subs && currentProject.subs.length > 0) {
                subsHTML = `<div class="space-y-4"><h2 class="text-2xl font-bold mb-6 border-b border-theme pb-4"><i class="ph ph-stack mr-3"></i> Fases</h2>`;
                currentProject.subs.forEach((sub, i) => {
                    let subMedia = '';
                    
                    // Galería de múltiples fotos
                    if (sub.mediaType === 'image' && sub.mediaList && sub.mediaList.length > 0) {
                        subMedia = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">`;
                        sub.mediaList.forEach(img => {
                            subMedia += `<img src="${img}" class="w-full h-48 md:h-64 object-cover rounded-xl shadow-sm border border-theme" />`;
                        });
                        subMedia += `</div>`;
                    }
                    if (sub.mediaType === 'video' && sub.media) subMedia = `<div class="mb-6 rounded-xl border border-theme"><a href="${sub.media}" target="_blank" class="flex items-center justify-center p-8 bg-black/5 font-bold hover:underline"><i class="ph ph-link-simple mr-2"></i> Ver video</a></div>`;
                    
                    subsHTML += `
                    <div class="border border-theme rounded-2xl bg-card">
                        <button onclick="toggleAcc(${i})" class="w-full p-6 flex justify-between items-center text-left hover:opacity-70">
                            <h3 class="font-bold text-xl flex items-center gap-4"><span class="w-8 h-8 rounded-full flex items-center justify-center text-sm bg-accent">${i + 1}</span> ${sub.title || `Fase ${i+1}`}</h3>
                            <i class="ph ph-caret-down text-xl" id="icon-acc-${i}"></i>
                        </button>
                        <div id="acc-${i}" class="p-6 pt-2 border-t border-theme hidden-view">
                            ${subMedia}
                            <div class="whitespace-pre-wrap text-base leading-relaxed">${sub.content}</div>
                        </div>
                    </div>`;
                });
                subsHTML += `</div>`;
            }

            container.innerHTML = `
                <div class="max-w-4xl mx-auto pb-20">
                    <div class="flex justify-between items-center mb-8">
                        <button onclick="showView('dashboard')" class="text-muted flex items-center font-bold hover:opacity-70"><i class="ph ph-arrow-left mr-2"></i> Volver</button>
                        ${isMember ? `
                        <div class="flex gap-3">
                            <button onclick='showView("editor", currentProject)' class="px-4 py-2 border border-theme rounded-lg text-sm font-bold"><i class="ph ph-pencil-simple"></i> Editar</button>
                            <button onclick="deleteProj('${currentProject.id}')" class="px-4 py-2 border border-red-500 text-red-500 rounded-lg text-sm font-bold"><i class="ph ph-trash"></i> Borrar</button>
                        </div>` : ''}
                    </div>
                    <span class="px-3 py-1 bg-black/5 rounded-full text-xs font-bold uppercase mb-4 inline-block border border-theme">${currentProject.category === 'nosotros' ? 'Sobre Nosotros' : 'Avance del Proyecto'}</span>
                    <h1 class="text-4xl md:text-5xl font-black mb-4 leading-tight">${currentProject.title}</h1>
                    <p class="text-sm font-bold uppercase mb-10 text-muted">${currentProject.date}</p>
                    ${mediaHTML}
                    <div class="text-lg leading-relaxed mb-16 whitespace-pre-wrap font-medium">${currentProject.desc}</div>
                    ${subsHTML}
                </div>
            `;
        }

        function toggleAcc(id) {
            const el = document.getElementById(`acc-${id}`);
            const icon = document.getElementById(`icon-acc-${id}`);
            if(el.classList.contains('hidden-view')) { el.classList.remove('hidden-view'); icon.className = 'ph ph-caret-up text-xl'; }
            else { el.classList.add('hidden-view'); icon.className = 'ph ph-caret-down text-xl'; }
        }

        function deleteProj(id) {
            if(confirm("¿Seguro que deseas eliminar este proyecto?")) {
                projects = projects.filter(p => p.id !== id);
                saveProjects();
                showToast("Proyecto eliminado");
                showView('dashboard');
            }
        }

        // --- 5. EDITOR AVANZADO ---
        let edData = { title: '', desc: '', category: 'avance', mediaType: 'none', media: '', subs: [] };

        function renderEditor(container, data) {
            if (data) {
                edData = JSON.parse(JSON.stringify(data));
                if(!edData.category) edData.category = 'avance';
                edData.subs.forEach(s => { if(!s.mediaList) s.mediaList = s.media ? [s.media] : []; });
            } else {
                edData = { title: '', desc: '', category: 'avance', mediaType: 'none', media: '', subs: [] };
            }
            drawEditor();
        }

        function drawEditor() {
            const container = document.getElementById('main-content');
            
            let subsHTML = '';
            edData.subs.forEach((s, i) => {
                
                let galeriaHTML = '';
                if (s.mediaType === 'image') {
                    galeriaHTML = `<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4">`;
                    s.mediaList.forEach((img, imgIdx) => {
                        galeriaHTML += `
                            <div class="relative group h-24 border border-theme rounded-lg overflow-hidden">
                                <img src="${img}" class="w-full h-full object-cover" />
                                <button type="button" onclick="edData.subs[${i}].mediaList.splice(${imgIdx}, 1); drawEditor();" class="absolute top-1 right-1 bg-red-500 text-white p-1 rounded text-xs opacity-80 hover:opacity-100"><i class="ph ph-trash"></i></button>
                            </div>
                        `;
                    });
                    galeriaHTML += `
                        <label class="flex flex-col items-center justify-center h-24 border-2 border-dashed border-theme rounded-lg cursor-pointer hover:bg-black/5 text-muted">
                            <i class="ph ph-plus text-2xl"></i><span class="text-xs font-bold mt-1">Añadir Foto</span>
                            <input type="file" multiple accept="image/*" class="hidden" onchange="processMultipleImgs(this.files, ${i})" />
                        </label>
                    </div>`;
                }

                subsHTML += `
                <div class="p-6 border-2 border-theme rounded-2xl bg-card">
                    <div class="flex justify-between items-center gap-4 mb-4 border-b border-theme pb-4">
                        <input oninput="edData.subs[${i}].title = this.value" value="${s.title}" placeholder="Título de la Fase" class="flex-1 text-xl font-bold bg-transparent border-none focus:outline-none" />
                        <button onclick="event.preventDefault(); edData.subs.splice(${i}, 1); drawEditor();" class="p-2 text-red-500 hover:bg-red-100 rounded"><i class="ph ph-trash"></i></button>
                    </div>
                    <textarea oninput="edData.subs[${i}].content = this.value" placeholder="Contenido de la fase..." rows="3" class="w-full p-4 border border-theme rounded-xl bg-transparent mb-4 focus:outline-none">${s.content}</textarea>
                    
                    <div class="p-4 border border-theme rounded-xl bg-black/5">
                        <div class="flex gap-4 mb-2">
                            <label><input type="radio" name="stype_${i}" ${s.mediaType === 'none'?'checked':''} onchange="edData.subs[${i}].mediaType='none'; edData.subs[${i}].mediaList=[]; edData.subs[${i}].media=''; drawEditor();" /> Solo Texto</label>
                            <label><input type="radio" name="stype_${i}" ${s.mediaType === 'image'?'checked':''} onchange="edData.subs[${i}].mediaType='image'; drawEditor();" /> Imágenes (Galería)</label>
                            <label><input type="radio" name="stype_${i}" ${s.mediaType === 'video'?'checked':''} onchange="edData.subs[${i}].mediaType='video'; edData.subs[${i}].mediaList=[]; drawEditor();" /> Video (URL)</label>
                        </div>
                        ${s.mediaType === 'video' ? `<input type="text" oninput="edData.subs[${i}].media = this.value" value="${s.media}" placeholder="Pega el enlace externo de video" class="w-full p-2 border border-theme rounded bg-transparent text-sm mt-2 focus:outline-none" />` : ''}
                        ${s.mediaType === 'image' ? galeriaHTML : ''}
                    </div>
                </div>`;
            });

            container.innerHTML = `
                <div class="max-w-4xl mx-auto pb-20">
                    <button onclick="showView('${currentProject ? 'detail' : 'dashboard'}')" class="text-muted flex items-center mb-8 font-bold hover:opacity-70"><i class="ph ph-x mr-2"></i> Cancelar</button>
                    
                    <form onsubmit="event.preventDefault(); saveEdData();" class="space-y-12">
                        <div class="p-8 rounded-2xl border border-theme shadow-sm bg-card space-y-6">
                            <div class="flex gap-6 p-4 border border-theme rounded-xl bg-black/5">
                                <label class="font-bold text-sm">Categoría:</label>
                                <label class="flex items-center gap-2"><input type="radio" name="cat" ${edData.category === 'nosotros'?'checked':''} onchange="edData.category='nosotros'; drawEditor();" class="accent-black"/> Sobre Nosotros</label>
                                <label class="flex items-center gap-2"><input type="radio" name="cat" ${edData.category === 'avance'?'checked':''} onchange="edData.category='avance'; drawEditor();" class="accent-black"/> Avance del Proyecto</label>
                            </div>

                            <input required oninput="edData.title = this.value" value="${edData.title}" placeholder="Título Principal..." class="w-full text-4xl font-black bg-transparent border-b-2 border-theme py-2 focus:outline-none" />
                            <textarea required oninput="edData.desc = this.value" placeholder="Descripción general..." rows="4" class="w-full p-4 border border-theme rounded-xl bg-transparent focus:outline-none">${edData.desc}</textarea>

                            <div class="p-5 border border-theme rounded-xl bg-black/5">
                                <label class="font-bold text-sm mb-4 block"><i class="ph ph-image"></i> Portada Principal</label>
                                <div class="flex gap-6 mb-4">
                                    <label><input type="radio" name="mtype" ${edData.mediaType === 'none'?'checked':''} onchange="edData.mediaType='none'; edData.media=''; drawEditor();" /> Ninguna</label>
                                    <label><input type="radio" name="mtype" ${edData.mediaType === 'image'?'checked':''} onchange="edData.mediaType='image'; drawEditor();" /> Imagen</label>
                                    <label><input type="radio" name="mtype" ${edData.mediaType === 'video'?'checked':''} onchange="edData.mediaType='video'; drawEditor();" /> Video (URL)</label>
                                </div>
                                ${edData.mediaType !== 'none' ? `
                                    <div class="flex flex-col gap-2 p-4 bg-card border border-theme rounded-lg">
                                        ${edData.mediaType === 'image' ? `<input type="file" accept="image/*" onchange="processSingleImg(this.files[0], (url)=>{edData.media=url; drawEditor();})" class="mb-2 text-sm" />` : ''}
                                        <input type="text" oninput="edData.media = this.value" value="${edData.media}" placeholder="O pega URL externa" class="w-full p-2 border border-theme rounded bg-transparent text-sm focus:outline-none" />
                                        ${edData.mediaType === 'image' && edData.media ? `<img src="${edData.media}" class="h-32 object-cover mt-2 rounded border border-theme" />` : ''}
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        <div class="space-y-6 pt-6">
                            <h2 class="text-2xl font-bold border-b border-theme pb-4">Fases (${edData.subs.length})</h2>
                            ${subsHTML}
                            <button type="button" onclick="edData.subs.push({title:'', content:'', mediaType:'none', media:'', mediaList:[]}); drawEditor();" class="w-full py-6 border-2 border-dashed border-theme rounded-2xl font-bold flex flex-col items-center gap-2 hover:opacity-70 text-muted">
                                <i class="ph ph-plus-circle text-3xl"></i> Añadir Fase
                            </button>
                        </div>

                        <div class="sticky bottom-6 flex justify-end pt-6 border-t border-theme" style="background-color: var(--bg);">
                            <button type="submit" class="px-8 py-4 rounded-xl text-lg font-bold shadow-xl hover:opacity-90 bg-accent"><i class="ph ph-floppy-disk mr-2"></i> Guardar en Memoria</button>
                        </div>
                    </form>
                </div>
            `;
        }

        // --- Compresión de Imágenes para ahorrar memoria ---
        function processSingleImg(file, cb) {
            if (!file || !file.type.startsWith('image/')) return;
            showToast("Comprimiendo...");
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height, MAX = 500;
                    if(w>h && w>MAX){h*=MAX/w;w=MAX;} else if(h>MAX){w*=MAX/h;h=MAX;}
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    cb(canvas.toDataURL('image/jpeg', 0.5));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function processMultipleImgs(files, subIndex) {
            if (!files || files.length === 0) return;
            showToast("Procesando fotos...");
            let processedCount = 0;
            
            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) { processedCount++; return; }
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height, MAX = 400; // Más compresión para galerías
                        if(w>h && w>MAX){h*=MAX/w;w=MAX;} else if(h>MAX){w*=MAX/h;h=MAX;}
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        
                        edData.subs[subIndex].mediaList.push(canvas.toDataURL('image/jpeg', 0.5));
                        processedCount++;
                        
                        if (processedCount === files.length) {
                            showToast("Fotos añadidas");
                            drawEditor();
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function saveEdData() {
            if (currentProject && currentProject.id) {
                projects = projects.map(p => p.id === currentProject.id ? { ...edData, id: p.id, date: p.date } : p);
            } else {
                projects.unshift({ ...edData, id: 'id_' + Date.now(), date: new Date().toLocaleDateString() });
            }
            saveProjects();
            showToast("Guardado localmente. ¡No olvides PUBLICAR!");
            showView('dashboard');
            currentProject = null;
        }

        // --- PANEL DE AJUSTES Y EXPORTACIÓN ---
        function renderSettings(container) {
            container.innerHTML = `
                <div class="max-w-xl mx-auto">
                    <button onclick="showView('dashboard')" class="text-muted flex items-center mb-6 font-bold hover:opacity-70"><i class="ph ph-arrow-left mr-2"></i> Volver</button>
                    
                    <div class="p-8 border border-theme rounded-2xl shadow-sm bg-card mb-8">
                        <h2 class="text-2xl font-bold mb-8 text-blue-500"><i class="ph ph-cloud-arrow-up mr-2"></i> Publicar en GitHub</h2>
                        <p class="mb-6 text-sm text-muted">Como no usamos bases de datos externas, para que el resto del mundo vea tus cambios debes descargar la web y subirla a tu GitHub.</p>
                        <ol class="list-decimal ml-5 mb-8 text-sm font-medium space-y-2">
                            <li>Haz clic en el botón azul de abajo.</li>
                            <li>Se descargará un archivo llamado <code>index.html</code>.</li>
                            <li>Entra a tu repositorio en GitHub y arrastra este nuevo archivo para reemplazar el viejo.</li>
                        </ol>
                        <button onclick="downloadWeb()" class="w-full py-4 rounded-xl font-bold shadow-md bg-blue-500 text-white hover:bg-blue-600 flex justify-center items-center gap-2"><i class="ph ph-download-simple text-xl"></i> 1. DESCARGAR WEB ACTUALIZADA</button>
                    </div>

                    <div class="p-8 border border-theme rounded-2xl shadow-sm bg-card">
                        <h2 class="text-xl font-bold mb-6"><i class="ph ph-gear mr-2"></i> Título de la Plataforma</h2>
                        <input id="t-input" value="${document.getElementById('site-title').textContent}" class="w-full p-2 border-b-2 border-theme text-xl font-bold bg-transparent focus:outline-none mb-6" />
                        <button onclick="localStorage.setItem('fab_title', document.getElementById('t-input').value); document.getElementById('site-title').textContent = document.getElementById('t-input').value; showToast('Título guardado');" class="px-6 py-2 rounded-lg font-bold bg-accent text-sm">Guardar Título</button>
                    </div>
                </div>
            `;
        }
    </script>

</body>
</html>
